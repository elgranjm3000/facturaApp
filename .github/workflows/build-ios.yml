name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build web
      run: npm run build
    
    - name: Setup Capacitor iOS
      run: |
        if [ ! -d "ios" ]; then
          npm install @capacitor/core@6 @capacitor/cli@6
          npx capacitor add ios
        fi
        npx capacitor sync ios
    
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install
    
    - name: Build Archive
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Debug \
          -archivePath build/App.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          archive
    
    - name: Generate IPA
      run: |
        cd ios/App
        mkdir -p build/output
        cp -r build/App.xcarchive/Products/Applications/App.app build/output/
        cd build/output
        mkdir Payload
        mv App.app Payload/
        zip -r App.ipa Payload
        ls -lh App.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/output/App.ipa