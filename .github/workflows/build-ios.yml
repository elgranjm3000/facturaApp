name: Build iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build web
      run: npm run build
    
    - name: Setup Capacitor iOS (si no existe)
      run: |
        if [ ! -d "ios" ]; then
          npm install @capacitor/core@6 @capacitor/cli@6
          npx capacitor add ios
        fi
    
    - name: Sync Capacitor
      run: npx capacitor sync ios
    
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install
    
    - name: Build iOS App (Debug - sin certificados)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Debug \
          -derivedDataPath build \
          -destination 'generic/platform=iOS'
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/App/build